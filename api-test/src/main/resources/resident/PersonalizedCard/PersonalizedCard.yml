PersonalizedCard:
   Resident_PersonalizedCard_uin_all_Valid_Smoke:
      endPoint: /resident/v1/download/personalized-card
      uniqueIdentifier: TC_Resident_PersonalizesCard_01      
      description: Verify that the system successfully returns the personalized card PDF when the API is called with valid input details and a valid UIN
      role: residentNew
      additionalDependencies: Dependent_ESignet_GenerateToken_01
      restMethod: post
      inputTemplate: resident/PersonalizedCard/PersonalizedCard
      outputTemplate: resident/PersonalizedCard/PersonalizedCardResult
      input: '{
       "requesttime": "$TIMESTAMP$",
       "html": "$PERSONALIZED_CARD_HTML$",
       "attributes": [{"attributesVal": "firstName"}, {"attributesVal": "dateOfBirth"}, {"attributesVal": "email"}]
}'
      output: '{
       "Content-Type": "application/pdf"
}'

