ReqAidOtp:
   Resident_ReqAidOtp_all_Valid_Smoke:
      endPoint: /resident/v1/individualId/otp
      uniqueIdentifier: TC_Resident_ReqAID_01
      description: Verify that the system successfully sends the OTP when the API is called with valid input details and a valid UIN
      role: resident
      restMethod: post
      checkErrorsOnlyInResponse: true
      auditLogCheck: true
      inputTemplate: resident/ReqAidOtp/ReqAidOtp
      outputTemplate: resident/ReqAidOtp/ReqAidOtpResult
      input: '{
      	"transactionId": "$TRANSACTIONID$",
		"requestTime": "$TIMESTAMP$",
		"individualId": "$ID:AddIdentity_Positive_PRE_smoke_UIN$",
		"otpChannel": [{channel: "EMAIL"},{channel: "PHONE"}],
		"aid": "$ID:UpdateUIN_Valid_All_Smoke_Pos_sid_registrationId$"
}'
      output: '{
}'

   Resident_ReqAidOtp_Invalid_IndividualId_Neg:
      endPoint: /resident/v1/individualId/otp
      uniqueIdentifier: TC_Resident_ReqAID_02      
      description: Verify that the system returns an error when the API is called with otp using invalid individualID
      role: resident
      restMethod: post
      inputTemplate: resident/ReqAidOtp/ReqAidOtp
      outputTemplate: resident/error
      input: '{
      	"transactionId": "$TRANSACTIONID$",
		"requestTime": "$TIMESTAMP$",
		"individualId": "@$$#$#",
		"otpChannel": [{channel: "EMAIL"},{channel: "PHONE"}],
		"aid": "$ID:UpdateUIN_Valid_All_Smoke_Pos_sid_registrationId$"
}'
      output: '{
  "errors": [
    {
      "errorCode": "RES-SER-410"
    }
  ]
}'

   Resident_ReqAidOtp_Empty_IndividualId_Neg:
      endPoint: /resident/v1/individualId/otp
      uniqueIdentifier: TC_Resident_ReqAID_03      
