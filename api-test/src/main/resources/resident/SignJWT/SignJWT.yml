SignJWT:
   Resident_SignJWT_all_Valid_Smoke_sid:
      endPoint: /v1/keymanager/jwtSign
      uniqueIdentifier: TC_Dependency_esignet      
      description: Verify that the system successfully signs the JWT when the API is called with valid input details and a valid event ID
      role: resident
      checkErrorsOnlyInResponse: true
      restMethod: post
      inputTemplate: resident/SignJWT/SignJWT
      outputTemplate: resident/SignJWT/SignJWTResult
      input: '{
        "requesttime": "$TIMESTAMP$",
	    "dataToSign": "$IDPCLIENTPAYLOAD$",
	    "applicationId": "RESIDENT",
	    "referenceId": "",
	    "includePayload": true,
	    "includeCertificate": true,
	    "includeCertHash": false
}'
      output: '{
}'
   Resident_SignJWT_Vid_all_Valid_Smoke_sid:
      endPoint: /v1/keymanager/jwtSign
      uniqueIdentifier: TC_Dependency_esignet_Vid
      description: Verify that the system successfully signs a separate JWT for the VID token request, because eSignet accepts each client assertion jti only once
      role: resident
      checkErrorsOnlyInResponse: true
      restMethod: post
      inputTemplate: resident/SignJWT/SignJWT
      outputTemplate: resident/SignJWT/SignJWTResult
      input: '{
        "requesttime": "$TIMESTAMP$",
	    "dataToSign": "$IDPCLIENTPAYLOAD$",
	    "applicationId": "RESIDENT",
	    "referenceId": "",
	    "includePayload": true,
	    "includeCertificate": true,
	    "includeCertHash": false
}'
      output: '{
}'
