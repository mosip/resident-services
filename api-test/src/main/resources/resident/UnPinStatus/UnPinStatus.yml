UnPinStatus:
   Resident_UnPinStatus_uin_all_Valid_Smoke:
      endPoint: /resident/v1/unpinned/{eventId}
      uniqueIdentifier: TC_Resident_UnpinStatus_01      
      description: Verify that the system successfully unpins the status for the event when the API is called with valid input details and a valid UIN
      role: residentNew
      restMethod: post
      additionalDependencies: Dependent_ESignet_GenerateToken_01
      inputTemplate: resident/UnPinStatus/UnPinStatus
      outputTemplate: resident/UnPinStatus/UnPinStatusResult
      input: '{
      	"eventId": "$ID:GetServiceHistory_uin_all_Valid_Smoke_sid_eventId$"
}'
      output: '{
      		"status": "200"
}'

   Resident_UnPinStatus_vid_all_Valid_Smoke:
      endPoint: /resident/v1/unpinned/{eventId}
      uniqueIdentifier: TC_Resident_UnpinStatus_02      
      description: Verify that the system successfully unpins the status for the event when the API is called with valid input details and a valid VID
      role: residentNewVid
      restMethod: post
      additionalDependencies: Dependent_ESignet_GenerateToken_02
      inputTemplate: resident/UnPinStatus/UnPinStatus
      outputTemplate: resident/UnPinStatus/UnPinStatusResult
      input: '{
      	"eventId": "$ID:GetServiceHistory_vid_all_Valid_Smoke_sid_eventId$"
}'
      output: '{
      		"status": "200"
}'

   Resident_UnPinStatus_uin_Invalid_Input_Neg:
      endPoint: /resident/v1/pinned/{eventId}
      uniqueIdentifier: TC_Resident_UnpinStatus_03      
      description: Verify that the system returns an error when the API is called with a valid UIN and invalid event ID
      role: residentNew
      restMethod: post
      additionalDependencies: Dependent_ESignet_GenerateToken_01
      inputTemplate: resident/UnPinStatus/UnPinStatus
      outputTemplate: resident/error
      input: '{
      	"eventId": "$@kk$"
}'
      output: '{
      	"errors": [
    {
      "errorCode": "RES-SER-410"
    }
  ]
}'

   Resident_UnPinStatus_vid_Invalid_Input_Neg:
      endPoint: /resident/v1/pinned/{eventId}
      uniqueIdentifier: TC_Resident_UnpinStatus_04      
      description: Verify that the system returns an error when the API is called with a valid VID and invalid event ID
      role: residentNewVid
      restMethod: post
      additionalDependencies: Dependent_ESignet_GenerateToken_02
      inputTemplate: resident/UnPinStatus/UnPinStatus
      outputTemplate: resident/error
      input: '{
      	"eventId": "$@kk$"
}'
      output: '{
      	"errors": [
    {
      "errorCode": "RES-SER-410"
    }
  ]
}'

   Resident_UnPinStatus_uin_StatusCode_Invalid_Token_Neg:
      endPoint: /resident/v1/pinned/{eventId}
      uniqueIdentifier: TC_Resident_UnpinStatus_05      
      description: Verify that the system returns an error when the API is called with a valid UIN and invalid token
      role: invalid
      validityCheckRequired: true
      restMethod: post
      inputTemplate: resident/UnPinStatus/UnPinStatus
      outputTemplate: resident/error
      input: '{
      	"eventId": "$ID:GetServiceHistory_uin_all_Valid_Smoke_sid_eventId$"
}'
      output: "401"