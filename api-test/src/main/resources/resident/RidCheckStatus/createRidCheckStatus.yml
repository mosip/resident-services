RidCheckStatus:
   Resident_RidCheckStatus_AllValid_Smoke:
      endPoint: /resident/v1/rid/check-status
      uniqueIdentifier: TC_Resident_Ridstatus_01      
      description: Verify that the system successfully returns the RID status when the API is called with valid input details
      role: resident
      checkErrorsOnlyInResponse: true
      restMethod: post
      inputTemplate: resident/RidCheckStatus/createRidCheckStatus
      outputTemplate: resident/RidCheckStatus/createRidCheckStatusResult
      input: '{
    "individualId": "$ID:UpdateUIN_Valid_All_Smoke_Pos_sid_registrationId$",
    "id": "mosip.resident.checkstatus",
    "individualIdType": "RID",
    "requesttime": "$TIMESTAMP$"
  }'
      output: '{
      	"ridStatus": "PROCESSED"
}'
   Resident_RidCheckStatus_Missing_InputParameter_individualId:
      endPoint: /resident/v1/rid/check-status
      uniqueIdentifier: TC_Resident_Ridstatus_02      
      description: Verify that the system returns an error when the API is called with individual id is removed from request
      role: resident
      checkErrorsOnlyInResponse: true
      restMethod: post
      inputTemplate: resident/RidCheckStatus/createRidCheckStatus
      outputTemplate: resident/error
      input: '{
    "individualId": "$REMOVE$",
    "id": "mosip.resident.checkstatus",
    "individualIdType": "RID",
    "requesttime": "$TIMESTAMP$"
  }'
      output: '{
   "errors": [
    {
      "errorCode": "RES-SER-410"
    }
  ]
}'
   Resident_RidCheckStatus_Invalid_InputParameter_individualId:
      endPoint: /resident/v1/rid/check-status
      uniqueIdentifier: TC_Resident_Ridstatus_03      
      description: Verify that the system returns an error when the API is called with invalid value is given for individual id
