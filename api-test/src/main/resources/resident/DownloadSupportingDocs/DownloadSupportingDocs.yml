DownloadSupportingDocs:
   Resident_DownloadSupportingDocs_all_Valid_smoke:
      endPoint: /resident/v1/download/supporting-documents
      uniqueIdentifier: TC_Resident_DownloadSupportingDocs_01
      description: Verify that the system successfully returns the supporting documents PDF when the API is called with valid input details
      role: resident
      restMethod: get
      inputTemplate: resident/DownloadSupportingDocs/DownloadSupportingDocs
      outputTemplate: resident/DownloadSupportingDocs/DownloadSupportingDocsResult
      input: '{
      "langcode":"$1STLANG$"
}'
      output: '{
      "Content-Type": "application/pdf"
}'

   Resident_DownloadSupportingDocs_Valid_smoke:
      endPoint: /resident/v1/download/supporting-documents
      uniqueIdentifier: TC_Resident_DownloadSupportingDocs_02
      description: Verify that the system successfully returns the supporting documents PDF when the API is called with valid input details and secondary language code
      role: resident
      restMethod: get
      inputTemplate: resident/DownloadSupportingDocs/DownloadSupportingDocs
      outputTemplate: resident/DownloadSupportingDocs/DownloadSupportingDocsResult
      input: '{
      "langcode":"$2NDLANG$"
}'
      output: '{
      "Content-Type": "application/pdf"
}'

   Resident_DownloadSupportingDocs_Empty_Lang_Neg:
      endPoint: /resident/v1/download/supporting-documents
      uniqueIdentifier: TC_Resident_DownloadSupportingDocs_03
      description: Verify that the system returns an error when the API is called with empty langcode
      role: resident
      restMethod: get
      inputTemplate: resident/DownloadSupportingDocs/DownloadSupportingDocs
      outputTemplate: resident/error
      input: '{
      "langcode":""
}'
      output: '{
      "errors": [
         {
            "errorCode": "RES-SER-410"
         }
      ]
}'

   Resident_DownloadSupportingDocs_Invalid_token:
      endPoint: /resident/v1/download/supporting-documents
      uniqueIdentifier: TC_Resident_DownloadSupportingDocs_04
      description: Verify that the system successfully returns the supporting documents PDF when the API is called with invalid token
      role: invalidtoken
      restMethod: get
      inputTemplate: resident/DownloadSupportingDocs/DownloadSupportingDocs
      outputTemplate: resident/DownloadSupportingDocs/DownloadSupportingDocsResult
      input: '{
      "langcode":"$1STLANG$"
}'
      output: '{
      "Content-Type": "application/pdf"
}'

   Resident_DownloadSupportingDocs_Invalid_lang_Neg:
      endPoint: /resident/v1/download/supporting-documents
      uniqueIdentifier: TC_Resident_DownloadSupportingDocs_05
      description: Verify that the system returns an error when the API is called with invalid langcode
      role: resident
      restMethod: get
      inputTemplate: resident/DownloadSupportingDocs/DownloadSupportingDocs
      outputTemplate: resident/error
      input: '{
      "langcode":"$1!ee$"
}'
      output: '{
      "errors": [
         {
            "errorCode": "RES-SER-410"
         }
      ]
}'

   Resident_DownloadSupportingDocs_Absent_langCode_Neg:
      endPoint: /resident/v1/download/supporting-documents
      uniqueIdentifier: TC_Resident_DownloadSupportingDocs_06
      description: Verify that the system returns an error when the API is called with absent langcode
      role: resident
      restMethod: get
      inputTemplate: resident/DownloadSupportingDocs/DownloadSupportingDocs
      outputTemplate: resident/error
      input: '{
      "langcode":"$REMOVE$"
}'
      output: '{
      "errors": [
         {
            "errorCode": "RES-SER-418"
         }
      ]
}'
