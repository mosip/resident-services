DownloadRegCenterDetails:
   Resident_DownloadRegCenterDetails_all_Valid_Smoke:
      endPoint: /resident/v1/download/registration-centers-list
      uniqueIdentifier: TC_Resident_DownloadRegCenterDetails_01
      description: Verify that the system successfully returns the registration center details PDF when the API is called with valid input details
      role: resident
      restMethod: get
      inputTemplate: resident/DownloadRegCenterDetails/DownloadRegCenterDetails
      outputTemplate: resident/DownloadRegCenterDetails/DownloadRegCenterDetailsResult
      input: '{
		  "langcode": "$1STLANG$",
		  "hierarchylevel": "5",
		  "name": "10112"
}'
      output: '{
      "Content-Type": "application/pdf"
}'

   Resident_DownloadRegCenterDetails_Invalid_Langcode_Neg:
      endPoint: /resident/v1/download/registration-centers-list
      uniqueIdentifier: TC_Resident_DownloadRegCenterDetails_02
      description: Verify that the system returns an error when the API is called with invalid langcode
      role: resident
      restMethod: get
      inputTemplate: resident/DownloadRegCenterDetails/DownloadRegCenterDetails
      outputTemplate: resident/error
      input: '{
		  "langcode": "hinn",
		  "hierarchylevel": "5",
		  "name": "10112"
}'
      output: '{
      "errors": [
         {
            "errorCode": "RES-SER-410"
         }
      ]
}'

   Resident_DownloadRegCenterDetails_Invalid_Hierarchylevel_Neg:
      endPoint: /resident/v1/download/registration-centers-list
      uniqueIdentifier: TC_Resident_DownloadRegCenterDetails_03
      description: Verify that the system returns an error when the API is called with invalid hierarchylevel
      role: resident
      restMethod: get
      inputTemplate: resident/DownloadRegCenterDetails/DownloadRegCenterDetails
      outputTemplate: resident/error
      input: '{
		  "langcode": "$1STLANG$",
		  "hierarchylevel": "sdsd#@",
		  "name": "10112"
}'
      output: '{
      "errors": [
         {
            "errorCode": "RES-SER-418"
         }
      ]
}'

   Resident_DownloadRegCenterDetails_Invalid_Name_Neg:
      endPoint: /resident/v1/download/registration-centers-list
      uniqueIdentifier: TC_Resident_DownloadRegCenterDetails_04
      description: Verify that the system returns an error when the API is called with invalid name
      role: resident
      restMethod: get
      inputTemplate: resident/DownloadRegCenterDetails/DownloadRegCenterDetails
      outputTemplate: resident/error
      input: '{
		  "langcode": "$1STLANG$",
		  "hierarchylevel": "5",
		  "name": "10@##112"
}'
      output: '{
        "errors": [
          {
             "errorCode": "RES-SER-418"
          }
      ]
}'

   Resident_DownloadRegCenterDetails_Invalid_All_Input_Neg:
      endPoint: /resident/v1/download/registration-centers-list
      uniqueIdentifier: TC_Resident_DownloadRegCenterDetails_05
      description: Verify that the system returns an error when the API is called with all invalid inputs
      role: resident
      restMethod: get
      inputTemplate: resident/DownloadRegCenterDetails/DownloadRegCenterDetails
      outputTemplate: resident/error
      input: '{
		  "langcode": "engg",
		  "hierarchylevel": "5sd",
		  "name": "10@##112"
}'
      output: '{
        "errors": [
           {
              "errorCode": "RES-SER-418"
           }
      ]
}'