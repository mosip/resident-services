PinStatus:
   Resident_PinStatus_uin_all_Valid_Smoke:
      endPoint: /resident/v1/pinned/{eventId}
      uniqueIdentifier: TC_Resident_PinStatus_01
      description: Verify that the system successfully updates the pin status when the API is called with valid input details, valid EID and a valid UIN
      role: residentNew
      restMethod: post
      additionalDependencies: Dependent_ESignet_GenerateToken_01
      inputTemplate: resident/PinStatus/PinStatus
      outputTemplate: resident/PinStatus/PinStatusResult
      input: '{
      	"eventId": "$ID:GetServiceHistory_uin_all_Valid_Smoke_sid_eventId$"
}'
      output: '{
      		"status": "200"
}'

   Resident_PinStatus_vid_all_Valid_Smoke:
      endPoint: /resident/v1/pinned/{eventId}
      uniqueIdentifier: TC_Resident_PinStatus_02      
      description: Verify that the system successfully updates the pin status when the API is called with valid input details, valid EID and a valid VID
      role: residentNewVid
      restMethod: post
      additionalDependencies: Dependent_ESignet_GenerateToken_02
      inputTemplate: resident/PinStatus/PinStatus
      outputTemplate: resident/PinStatus/PinStatusResult
      input: '{
      	"eventId": "$ID:GetServiceHistory_vid_all_Valid_Smoke_sid_eventId$"
}'
      output: '{
      		"status": "200"
}'

   Resident_PinStatus_uin_Invalid_Input_Neg:
      endPoint: /resident/v1/pinned/{eventId}
      uniqueIdentifier: TC_Resident_PinStatus_03      
      description: Verify that the system returns an error when the API is called with a valid UIN and invalid EID
      role: residentNew
      restMethod: post
      additionalDependencies: Dependent_ESignet_GenerateToken_01
      inputTemplate: resident/PinStatus/PinStatus
      outputTemplate: resident/error
      input: '{
      	"eventId": "$@kk$"
}'
      output: '{
      	"errors": [
    {
      "errorCode": "RES-SER-410"
    }
  ]
}'

   Resident_PinStatus_vid_Invalid_Input_Neg:
      endPoint: /resident/v1/pinned/{eventId}
      uniqueIdentifier: TC_Resident_PinStatus_04     
      description: Verify that the system returns an error when the API is called with a valid VID and invalid EID
      role: residentNewVid
      restMethod: post
      additionalDependencies: Dependent_ESignet_GenerateToken_02
      inputTemplate: resident/PinStatus/PinStatus
      outputTemplate: resident/error
      input: '{
      	"eventId": "$@kk$"
}'
      output: '{
      	"errors": [
    {
      "errorCode": "RES-SER-410"
    }
  ]
}'

   Resident_PinStatus_uin_StatusCode_Invalid_Token_Neg:
      endPoint: /resident/v1/pinned/{eventId}
      uniqueIdentifier: TC_Resident_PinStatus_05
      description: Verify that the system returns an error when the API is called with a valid UIN and invalid token      
      role: invalid
      validityCheckRequired: true
      restMethod: post
      inputTemplate: resident/PinStatus/PinStatus
      outputTemplate: resident/error
      input: '{
      	"eventId": "$ID:GetServiceHistory_uin_all_Valid_Smoke_sid_eventId$"
}'
      output: "401"